# Evaluation setting of the paper for Qwen2.5-VL-7B XD-Violence RL checkpoints
# (XD-Violence reasoning query, stripped).
name: xdviolence-qwen2.5vl-rl
description: >-
  XD-Violence, Qwen2.5-VL RL checkpoints (GRPO and ATPO), the paper's evaluation prompt
  v1reason and video settings.
taxonomy: xdviolence
prompt:
  file: xdviolence/v1reason.txt
  strip: true
  sha256: ff2723de2c7c97e48553fcc1dddfe6a27cdd2f1cdea18dc06e10afc95184ad95
system_prompt: You are a video violence detection assistant.
response_format: think_answer
video: {fps: 1.0, min_pixels: 12544, max_pixels: 200704, image_patch_size: 14, position: after}
parser: {output_style: json, scope: full_response, require_block_prefix: true}
generation: {max_new_tokens: 1024, temperature: 0.0, top_p: 1.0, top_k: -1, repetition_penalty: 1.0}
base_model: Qwen/Qwen2.5-VL-7B-Instruct
processor: {source: Qwen/Qwen2.5-VL-7B-Instruct, revision: null, use_fast: false}
max_model_len: 98304
provenance:
  notes:
    - The processor revision used for the paper's evaluation was not recorded.
