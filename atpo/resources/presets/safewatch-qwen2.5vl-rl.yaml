# Evaluation setting of the paper for Qwen2.5-VL-7B SafeWatch GRPO/ATPO checkpoints
# (default SafeWatch query, used verbatim).
name: safewatch-qwen2.5vl-rl
description: >-
  SafeWatch, Qwen2.5-VL RL checkpoints (GRPO and ATPO), the paper's evaluation prompt
  and video settings.
taxonomy: safewatch
prompt:
  file: safewatch/inference_default_rl.txt
  strip: false
  sha256: 85e4f0b6ea517682a9c607ed59b3b3b0a0102a5afabfa4f877a0ebe6e20d20e1
system_prompt: You are a helpful video content moderation assistant.
response_format: think_answer
video: {fps: 1.0, min_pixels: 12544, max_pixels: 200704, image_patch_size: 14, position: after}
parser: {output_style: json, scope: full_response, require_block_prefix: true}
generation: {max_new_tokens: 1024, temperature: 0.0, top_p: 1.0, top_k: -1, repetition_penalty: 1.0}
base_model: Qwen/Qwen2.5-VL-7B-Instruct
processor: {source: Qwen/Qwen2.5-VL-7B-Instruct, revision: null, use_fast: false}
max_model_len: 98304
provenance:
  notes:
    - The processor revision used for the paper's evaluation was not recorded.
    - RL training rendered the prompt without a system message and with the video between
      the task text and the format instruction; this evaluation setting differs (see
      docs/inference.md).
