# Evaluation setting of the paper for Qwen3-VL-8B XD-Violence RL checkpoints
# (Qwen3-VL XD-Violence reasoning query, stripped).
name: xdviolence-qwen3vl-rl
description: >-
  XD-Violence, Qwen3-VL RL checkpoints, prompt v1_qwen3 and the paper's video settings.
taxonomy: xdviolence
prompt:
  file: xdviolence/v1_qwen3.txt
  strip: true
  sha256: 643cdc26f4969e5dd0f7e6ca110e2883b8e78ae343b9cadd33a5a49035fcf9be
system_prompt: You are a video violence detection assistant.
response_format: triple_newline
video: {fps: 1.0, min_pixels: 12544, max_pixels: 200704, image_patch_size: 14, position: after}
parser: {output_style: json, scope: full_response, require_block_prefix: true}
generation: {max_new_tokens: 1024, temperature: 0.0, top_p: 1.0, top_k: -1, repetition_penalty: 1.0}
base_model: Qwen/Qwen3-VL-8B-Instruct
processor: {source: Qwen/Qwen3-VL-8B-Instruct, revision: null, use_fast: false}
max_model_len: 98304
provenance:
  notes:
    - image_patch_size 14 is the qwen-vl-utils default used in the paper's evaluation.
