# LLaMA-Factory LoRA SFT settings shared by the SafeWatch and XD-Violence SFT configs.
# Differences from the paper's runs, outside the optimisation: report_to is "none" (the runs
# logged to W&B) and paths are variables.
format: atpo.training/v1
kind: llamafactory

variables:
  DATASET_DIR: {description: "LLaMA-Factory dataset directory with dataset_info.json (written by atpo prepare)"}
  MEDIA_DIR: {description: "Directory that relative video paths are resolved against (LLaMA-Factory media_dir); null uses DATASET_DIR", default: null}

llamafactory:
  model_name_or_path: null      # set by the recipe
  template: null                # set by the recipe
  trust_remote_code: true
  stage: sft
  do_train: true
  finetuning_type: lora
  lora_rank: 64
  lora_alpha: 128
  lora_target: all
  dataset: null                 # set by the recipe
  dataset_dir: ${DATASET_DIR}
  media_dir: ${MEDIA_DIR}
  cutoff_len: 24576            # maximum sequence length stated in the paper
  max_samples: 100000
  overwrite_cache: false
  preprocessing_num_workers: 4
  preprocessing_batch_size: 1000
  dataloader_num_workers: 1
  image_max_pixels: 262144
  video_max_pixels: 50176
  video_min_pixels: 3136
  video_fps: 1.0
  video_maxlen: 1280
  freeze_vision_tower: true
  output_dir: auto              # <output-dir>/lora
  logging_steps: 10
  save_steps: 1000
  plot_loss: true
  overwrite_output_dir: true
  save_only_model: false
  report_to: none
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  num_train_epochs: 1.0
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  bf16: true
  pure_bf16: true
  gradient_checkpointing: true
  ddp_timeout: 180000000
  flash_attn: sdpa
  resume_from_checkpoint: null
  use_fast_tokenizer: false

# LoRA merge (atpo merge-lora): llamafactory-cli export with these settings.
export:
  model_name_or_path: null      # set by the recipe
  template: null
  finetuning_type: lora
  export_size: 4
  export_device: cpu
  export_legacy_format: false
