# Named checkpoint references: `atpo predict --model <name>`, VideoSafetyModel.from_pretrained(<name>).
#
# No checkpoint has been published yet: hub_id and revision stay null until upload, and
# training_config is filled in for each RL checkpoint when it is published. Until then a
# name can point at a local directory or a private repository:
#   ATPO_MODEL_<NAME>=<path or repo id>  [ATPO_MODEL_<NAME>_REVISION=<revision>]
#     (NAME upper-cased; characters other than letters and digits become '_')
#   ATPO_MODELS_FILE=my_models.yaml   (this layout; give `path` or `hub_id` per name)
# inference_preset applies only to checkpoints without atpo_config.json.
# This file is mirrored at atpo/resources/models.yaml (tests check that both are equal).
