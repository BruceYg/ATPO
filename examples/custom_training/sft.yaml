# Optional SFT warm-up on the custom taxonomy (LoRA, one epoch).
#   atpo train --config examples/custom_training/sft.yaml --output-dir runs/sft \
#     --var DATASET_DIR=atpo_example/sft --var MEDIA_DIR=atpo_example/videos
extends: ../../configs/sft/base.yaml
name: workplace_sft
description: "LoRA SFT warm-up for the workplace-safety example taxonomy."
variables:
  BASE_MODEL: {description: "Base model (Hugging Face ID or local path)", default: Qwen/Qwen2.5-VL-7B-Instruct}
  TEMPLATE: {description: "LLaMA-Factory template (qwen2_vl for Qwen2.5-VL, qwen3_vl_nothink for Qwen3-VL)", default: qwen2_vl}
llamafactory:
  model_name_or_path: ${BASE_MODEL}
  template: ${TEMPLATE}
  dataset: workplace_sft
export:
  model_name_or_path: ${BASE_MODEL}
  template: ${TEMPLATE}
